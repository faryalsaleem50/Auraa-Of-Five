<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorePlay - Join The Arena</title>
     <link rel="icon" type="image/x-icon" href="./assets/favicon-removebg-preview.png">
    <style>
        * { margin: 0; 
            padding: 0; 
            box-sizing: border-box;
             font-family: 'Segoe UI', sans-serif;
             }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 900px;
            min-height: 550px;
            background: #0a0a0a;
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 26, 26, 0.4);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.15);
        }

        #form-switch { display: none; }

        /* Left Red Side */
        .auth-info {
            flex: 1;
            background: linear-gradient(135deg, #ff1a1a, #800000);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #fff;
        }

        .auth-info .logo { 
            font-size: 2rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            margin-bottom: 20px; 
        }
        .auth-info .logo span {
             color: #000;
         }
        .info-content h1 { 
            font-size: 3.5rem;
             font-weight: 900; 
            margin-bottom: 15px;
             line-height: 1;
         }

        /* Right Form Side */
        .auth-form-box {
            flex: 1.3;
            padding: 60px;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form h2 { 
            font-size: 2.5rem; 
            margin-bottom: 30px; 
            color: #fff; 
            text-transform: uppercase; 
        }
        .form h2 span {
             border-bottom: 5px solid #ff1a1a; 
            padding-bottom: 5px;
         }

        .auth-input {
             width: 100%;
            margin-bottom: 18px; 
        }
        .auth-input input {
            width: 100%;
            padding: 16px;
            background: #151515;
            border: 1px solid #333;
            color: #fff;
            border-radius: 12px;
            outline: none;
            font-size: 1rem;
        }

        .auth-btn {
            width: 100%;
            padding: 16px;
            background: #ff1a1a;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .auth-btn:hover {
            background: #cc0000;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.4);
        }

        .auth-form-box p { 
            margin-top: 25px; 
            text-align: center; 
            color: #888; 
        }
        .auth-form-box label {
             color: #ff1a1a;
             cursor: pointer; 
            font-weight: bold;
             text-decoration: underline; 
        }

        /* --- SWITCH LOGIC --- */
        .login-form, .login-text { display: none; }
        .signup-form, .signup-text { display: flex; flex-direction: column; }

        #form-switch:checked ~ .auth-form-box .signup-form { display: none; }
        #form-switch:checked ~ .auth-form-box .login-form { display: flex; flex-direction: column; }
        
        #form-switch:checked ~ .auth-info .signup-text { display: none; }
        #form-switch:checked ~ .auth-info .login-text { display: block; }

        @media (max-width: 850px) {
            .auth-container { flex-direction: column; }
            .auth-info { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <input type="checkbox" id="form-switch">

        <div class="auth-info">
            <div class="logo">Core<span>Play</span></div>
            
            <div class="info-content signup-text">
                <h1>Join The Arena!</h1>
                <p>Enter your personal details and start your journey with us.</p>
            </div>

            <div class="info-content login-text">
                <h1>Welcome Back!</h1>
                <p>To keep connected with us please login with your personal info.</p>
            </div>
        </div>

        <div class="auth-form-box">
            
            <form class="form signup-form" id="signup-form">
                <h2>Sign <span>Up</span></h2>
                <div class="auth-input"><input type="text" id="signup-name" placeholder="Full Name" required></div>
                <div class="auth-input"><input type="email" id="signup-email" placeholder="Email Address" required></div>
                <div class="auth-input"><input type="password" id="signup-password" placeholder="Create Password" required></div>
                <button type="submit" class="auth-btn">Register</button>
                <p>Already a member? <label for="form-switch">Login Now</label></p>
            </form>

            <form class="form login-form" id="login-form">
                <h2>Sign <span>In</span></h2>
                <div class="auth-input"><input type="email" id="login-email" placeholder="Email Address" required></div>
                <div class="auth-input"><input type="password" id="login-password" placeholder="Password" required></div>
                <button type="submit" class="auth-btn">Login Now</button>
                <p>New here? <label for="form-switch">Create Account</label></p>
            </form>

        </div>
    </div>
  
    <script type="module" src="script.js"></script>
</body>
</html>
